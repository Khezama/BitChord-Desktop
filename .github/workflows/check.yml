name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  desktop:
    name: Desktop · JVM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Install desktop test libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libxtst6 libx11-xcb1

      - run: chmod +x gradlew
      - run: ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test --no-daemon
